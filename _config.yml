# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Jindal Digest for Competition and Innovation Laws
email: jindaldigest@gmail.com
description: >- 
  JDCIL is a student run, peer reviewed blog, tracing developments in Competition and Technology Law and Policy.

keywords: Jindal Digest,legal blog, law articles, legal analysis, constitutional law, technology law, India law, legal insights, competition law, innovation law, legal commentary, legal education, law students, legal professionals, legal research, legal writing

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://jindaldigest.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username: jindaldigest
linkedin_username: jindal-digest-for-competition-and-innovation-laws


header_pages:
  - home.md
  - general-guidelines-for-editing.md
  - blogs.md
    - from-our-contributors
    - from-our-editors
  - news-reels.md
  - about-us.md
  - contact-us.md

future: true

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO Settings
author:
  name: Jindal Digest
  email: jindaldigest@gmail.com
  twitter: jindaldigest
  github: jindaldigest
  linkedin: jindaldigest

# Site Settings
permalink: /:year/:month/:day/:title/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git/

# Sitemap Settings
sitemap:
  changefreq: daily
  priority: 0.7
  exclude:
    - /404.html
    - /assets/
    - /admin/
    - /private/

# Google Analytics
google_analytics: UA-XXXXXXXXX-X # Replace with your Google Analytics ID

# Social Media
social:
  twitter: https://twitter.com/jindaldigest
  github: https://github.com/jindaldigest
  linkedin: https://linkedin.com/in/jindaldigest

# Site Structure
collections:
  contributors:
    output: true
    permalink: /blogs/contributors/:title/
  editors:
    output: true
    permalink: /blogs/editors/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      author: "Jindal Digest"
      categories: []
      tags: []
      image: /assets/default-post-image.jpg
      description: "Read our latest legal insights and analysis from expert contributors."

# custom config
