---
layout: default
---
<article class="post">

  <div class="home">
    <h1 class="page-heading">{{ page.title | escape }}</h1>
  </div>
  <h2 class="post-list-heading">{{ page.list_title | default: "" }}</h2>
  <div class="post-body">
    <div class="post-content">
      {{ content }}
    </div>
  </div>

</article>
